name: CI

# Runs on every push and pull request: type-check, unit tests, production build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Debug APK for quick testing on a phone: Actions → this run → Artifacts.
  # Debug builds are signed with a throwaway key, so a newer debug APK cannot
  # be installed over an older one; uninstall first (back up data!) or use a
  # signed release APK from the Releases page.
  android-debug:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

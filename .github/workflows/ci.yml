name: CI

# Runs on every push and pull request: type-check, unit tests, production build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Debug APK for quick testing on a phone: Actions → this run → Artifacts.
  # Debug builds are signed with a throwaway key, so a newer debug APK cannot
  # be installed over an older one; uninstall first (back up data!) or use a
  # signed release APK from the Releases page.
  android-debug:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web app (test channel)
        run: npm run build
        env:
          BUILD_CHANNEL: test
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Package web bundle for live updates
        run: |
          (cd dist && zip -qr ../web-bundle.zip .)
          echo "NATIVE_ID=$(node scripts/native-id.mjs)" >> "$GITHUB_ENV"
          echo "BUNDLE_SHA=$(sha256sum web-bundle.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish test APK on the Releases page (pre-release, not used for updates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk restaurant-pos-test.apk
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "Test build of the latest code, for trying the app. Installed test builds update themselves from here."
            echo "Signed releases cannot update a test build: back up, uninstall, then install the release."
            echo ""
            echo "Version: ${VERSION}"
            echo "Build number: ${GITHUB_RUN_NUMBER}"
            echo "Native: ${NATIVE_ID}"
            echo "Bundle SHA-256: ${BUNDLE_SHA}"
            echo ""
            awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > notes.md
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build restaurant-pos-test.apk web-bundle.zip --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${GITHUB_RUN_NUMBER} (v${VERSION})" --notes-file notes.md

name: Release

# A release is made by pushing a version tag, e.g.:
#   npm version patch   (updates package.json, commits, tags vX.Y.Z)
#   git push --follow-tags
# This workflow then:
#   1. runs the tests,
#   2. deploys the web app (PWA) to GitHub Pages,
#   3. builds a signed Android APK,
#   4. publishes a GitHub Release with the APK and release notes.
# Installed apps check the deployed release (version.json / latest Release),
# never the latest commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"; exit 1
          fi

  pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app for /${{ github.event.repository.name }}/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web app for the APK
        run: npm run build
      - name: Package web bundle for live updates
        run: |
          (cd dist && zip -qr ../web-bundle.zip .)
          node scripts/native-id.mjs > native-id.txt
          sha256sum web-bundle.zip | cut -d' ' -f1 > web-bundle.sha256
      - run: npx cap sync android

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing. Building a DEBUG APK. It installs, but cannot be updated in place by later builds. See docs/ANDROID.md."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="$(node -p "require('../package.json').version")"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../restaurant-pos-${VERSION}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../restaurant-pos-${VERSION}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            restaurant-pos-*.apk
            web-bundle.zip
            web-bundle.sha256
            native-id.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pages, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "Version: ${VERSION}"
            echo "Native: $(cat native-id.txt)"
            echo "Bundle SHA-256: $(cat web-bundle.sha256)"
            echo ""
            awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > notes.md
          echo "" >> notes.md
          echo "Web app: https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/" >> notes.md
          cat notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" restaurant-pos-*.apk web-bundle.zip \
            --title "Restaurant POS $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
